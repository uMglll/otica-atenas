plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.oticaatenas.app'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.oticaatenas.app'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    // Chave temporária criada no GitHub Actions só para o APK de teste.
    // A chave de upload da Play Store nunca fica no repositório: o AAB sai daqui sem assinatura.
    signingConfigs {
        teste {
            storeFile file(System.getenv('TESTE_KEYSTORE') ?: 'chave-de-teste-ausente.jks')
            storePassword System.getenv('TESTE_SENHA') ?: ''
            keyAlias 'teste'
            keyPassword System.getenv('TESTE_SENHA') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        teste {
            initWith release
            signingConfig signingConfigs.teste
            matchingFallbacks = ['release']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
