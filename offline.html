<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sem conexão · Ótica Atenas</title>
<style>
:root{--bg:#EDEFEA;--ink:#1B2017;--muted:#586050;--accent:#4D5A29;--accent-ink:#F4F6EF;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#11140F;--ink:#E6E9E0;--muted:#A2A998;--accent:#B9C77E;--accent-ink:#141810;color-scheme:dark}}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 1.05rem/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px max(20px,env(safe-area-inset-right)) 24px max(20px,env(safe-area-inset-left));box-sizing:border-box}
.logo{width:180px;aspect-ratio:900/541;margin:0 auto 24px;background:var(--ink);-webkit-mask:url(/logo.svg) center/contain no-repeat;mask:url(/logo.svg) center/contain no-repeat}
h1{font-family:Georgia,serif;font-weight:400;font-size:1.9rem;margin:0 0 8px}
p{color:var(--muted);margin:0 0 24px;max-width:30ch}
button{font:600 1rem/1 system-ui,sans-serif;border:0;border-radius:999px;padding:14px 22px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="logo" role="img" aria-label="Ótica Atenas"></div>
  <h1>Sem conexão</h1>
  <p>Verifique sua internet e tente de novo. A Ótica Atenas fica na Av. 20 de Agosto, 2431, Centro, Catalão – GO.</p>
  <button type="button" onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
